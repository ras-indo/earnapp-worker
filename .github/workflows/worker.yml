name: worker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"   # setiap 5 jam; job ~5h45m, run berikutnya antre di concurrency group

concurrency:
  group: earnapp-worker
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 355          # < batas keras GitHub 360 menit
    steps:
      - uses: actions/checkout@v4

      - name: Diagnostik IP runner
        run: |
          echo "=== IP publik runner ==="
          curl -s --max-time 10 https://api.ipify.org; echo
          echo "=== ASN / org ==="
          curl -s --max-time 10 https://ipinfo.io/json || true
          echo

      - name: Dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev

      - name: Build
        run: |
          gcc -O2 -o earnappd cworker/earnappd.c -lssl -lcrypto -lpthread
          ls -lh earnappd

      - name: Restore state dari secrets
        env:
          NODES_TXT: ${{ secrets.NODES_TXT }}
          CONSENT: ${{ secrets.CONSENT }}
        run: |
          sudo mkdir -p /etc/earnapp
          printf '%s\n' "$NODES_TXT" | sudo tee /etc/earnapp/nodes.txt > /dev/null
          printf '%s' "$CONSENT" | sudo tee /etc/earnapp/consent > /dev/null
          sudo chmod 644 /etc/earnapp/nodes.txt /etc/earnapp/consent
          echo "node terdaftar: $(grep -c . /etc/earnapp/nodes.txt)"
          echo "consent: $(cat /etc/earnapp/consent)"

      - name: Tor (opsional, aktif kalau vars.EARNAPP_SOCKS diisi)
        if: vars.EARNAPP_SOCKS != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tor
          sudo service tor start || sudo tor --SocksPort 9050 --RunAsDaemon 1
          for i in $(seq 1 60); do
            curl -s --max-time 5 --socks5-hostname 127.0.0.1:9050 https://api.ipify.org >/dev/null && break
            sleep 2
          done
          echo "tor exit IP: $(curl -s --max-time 10 --socks5-hostname 127.0.0.1:9050 https://api.ipify.org)"
          curl -s --max-time 15 --socks5-hostname 127.0.0.1:9050 https://ipinfo.io/json | grep -E '"(org|city)"' || true

      - name: Proxy pool gratis
        run: |
          sudo PROXY_OUT=/etc/earnapp/proxies.txt PROXY_LOG=/tmp/proxy_pool.log \
            python3 cworker/proxy_pool.py --once --workers 300 --sample 10000 --keep 250 --allow-dc
          sudo PROXY_OUT=/etc/earnapp/proxies.txt PROXY_LOG=/tmp/proxy_pool.log \
            nohup python3 cworker/proxy_pool.py --interval 300 --workers 300 --sample 10000 --keep 250 --allow-dc \
            >/tmp/proxy_refresh.log 2>&1 &
          echo "pool awal: $(grep -vc '^#' /etc/earnapp/proxies.txt || true)"

      - name: Jalankan worker (5j45m)
        env:
          EARNAPP_SOCKS: ${{ vars.EARNAPP_SOCKS }}
          EARNAPP_PROXY_FILE: /etc/earnapp/proxies.txt
        run: |
          set -o pipefail
          timeout 20700 sudo env EARNAPP_SOCKS="$EARNAPP_SOCKS" EARNAPP_PROXY_FILE="$EARNAPP_PROXY_FILE" ./earnappd 2>&1 | stdbuf -oL sed -u 's/^/[worker] /'

      - name: Cleanup run & artifact lama
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${GITHUB_REPOSITORY}"
          KEEP="${GITHUB_RUN_ID}"
          echo "run aktif: $KEEP — menghapus run completed lain"
          gh api "/repos/$REPO/actions/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.id != $KEEP and .status == \"completed\") | .id" \
          | while read -r id; do
              [ -z "$id" ] && continue
              echo "  hapus run $id"
              gh api -X DELETE "/repos/$REPO/actions/runs/$id" >/dev/null 2>&1 || echo "  gagal $id"
            done
          gh api "/repos/$REPO/actions/artifacts?per_page=100" --jq '.artifacts[].id' 2>/dev/null \
          | while read -r a; do
              [ -z "$a" ] && continue
              gh api -X DELETE "/repos/$REPO/actions/artifacts/$a" >/dev/null 2>&1 || true
            done
          echo "=== sisa run ==="
          gh api "/repos/$REPO/actions/runs?per_page=20" --jq '.workflow_runs[] | "\(.id) \(.name) \(.status/\(.conclusion))"' || true
